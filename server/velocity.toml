config-version = "2.7"
bind = "@BIND@"
motd = "<aqua>Roy's Minecraft Adventure</aqua>"
show-max-players = 12
online-mode = @ONLINE@
force-key-authentication = @ONLINE@
prevent-client-proxy-connections = false
player-info-forwarding-mode = "modern"
forwarding-secret-file = "forwarding.secret"
announce-forge = false
kick-existing-players = false
ping-passthrough = "ALL"
enable-player-address-logging = false

[servers]
adventure = "127.0.0.1:25566"
try = ["adventure"]

[advanced]
compression-threshold = 256
compression-level = -1
login-ratelimit = @RATE@
connection-timeout = 5000
read-timeout = 30000
haproxy-protocol = false
bungee-plugin-message-channel = false
show-ping-requests = false
failover-on-unexpected-server-disconnect = false
announce-proxy-commands = false
log-command-executions = false
log-player-connections = true
accepts-transfers = false

[query]
enabled = false
port = 25565
map = "Adventure"
show-plugins = false
