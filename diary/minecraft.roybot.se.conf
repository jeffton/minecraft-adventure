server {
    listen 80;
    listen [::]:80;
    server_name minecraft.roybot.se;
    location /.well-known/acme-challenge/ {
        root /var/www/roybot.se;
        try_files $uri =404;
    }
    location / {
        return 301 https://minecraft.roybot.se$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name minecraft.roybot.se;
    root /var/www/roybot.se/minecraft;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/minecraft.roybot.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minecraft.roybot.se/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include snippets/security-hidden-files.conf;

    # The live renderer has no game-control handlers or command endpoint.
    location /live/ {
        proxy_pass http://127.0.0.1:8931/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Roycraft-Public-Viewer "1";
        proxy_read_timeout 75s;
        proxy_buffering off;
        add_header Cache-Control "no-store";
    }
    location / {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
